# ===========================================
# PostgreSQL 数据库部署
# 用法：docker-compose up -d
# 查看日志：docker-compose logs -f postgres
# 停止：docker-compose down
# ===========================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: scout_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-scout}
      POSTGRES_USER: ${PG_USER:-scout}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-scout123}
      # 时区设为东八区，与业务代码一致
      TZ: Asia/Shanghai
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/pg-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-scout} -d ${PG_DB:-scout}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 性能调优（适合 10 台设备并发的写入负载）
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=256MB
        -c effective_cache_size=512MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c wal_buffers=4MB
        -c checkpoint_completion_target=0.8
        -c random_page_cost=1.1
        -c autovacuum=on
        -c autovacuum_naptime=60
        -c log_min_duration_statement=500

volumes:
  pg_data:
    driver: local
